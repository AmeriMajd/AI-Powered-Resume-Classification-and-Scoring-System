name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FlaskApp/requirements-dev.txt

      - run: pip install -r FlaskApp/requirements-dev.txt
      - run: pytest FlaskApp/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontapp/package-lock.json

      - run: npm ci
        working-directory: frontapp
      - run: npm test -- --watchAll=false
        working-directory: frontapp
        env:
          CI: "true"
      - run: npm run build
        working-directory: frontapp
